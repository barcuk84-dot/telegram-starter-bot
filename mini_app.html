<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark"><title>FindTag</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#090d19;--text:#f5f7ff;--muted:#aab4cc}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 17px 32px;background:radial-gradient(circle at 10% 0%,#263a78 0,transparent 36%),radial-gradient(circle at 100% 30%,#532d77 0,transparent 34%),var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.wrap{max-width:520px;margin:0 auto}.top{padding:14px 4px 22px}.eyebrow{font-size:11px;letter-spacing:3px;color:#a9b9ff;font-weight:800}.title{font-size:33px;font-weight:900;letter-spacing:-1.2px;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.5}.panel{padding:17px;border:1px solid #ffffff20;border-radius:26px;background:linear-gradient(145deg,#ffffff14,#ffffff06);box-shadow:0 20px 60px #0006;backdrop-filter:blur(18px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:0;min-height:96px;border-radius:19px;padding:15px;text-align:left;color:white;font-size:15px;font-weight:850;box-shadow:inset 0 1px #ffffff50,0 8px 20px #0004;cursor:pointer;transition:transform .12s}.action:active{transform:scale(.97)}.action span{display:block;font-size:26px;margin-bottom:8px}.wide{grid-column:1/-1;min-height:76px}.a1{background:linear-gradient(135deg,#2877ff,#5b4be8)}.a2{background:linear-gradient(135deg,#9b4de0,#e34e9b)}.a3{background:linear-gradient(135deg,#08a88a,#0879ad)}.a4{background:linear-gradient(135deg,#e28a24,#d44e57)}.a5{background:linear-gradient(135deg,#d33d82,#8245c7)}.a6{background:linear-gradient(135deg,#43536e,#28344f)}.a7{background:linear-gradient(135deg,#0f9b8e,#2369c9)}.a8{background:linear-gradient(135deg,#626d83,#343d58)}.foot{text-align:center;color:#7f8aa4;font-size:11px;margin-top:18px}
</style></head><body><main class="wrap"><header class="top"><div class="eyebrow">TELEGRAM USERNAME INTELLIGENCE</div><div class="title">FindTag <span style="color:#8ea2ff">✦</span></div><div class="sub">Подбор, оценка и сравнение Telegram-юзернеймов.</div></header><section class="panel"><div class="grid">
<button class="action a1 wide" onclick="go('search')"><span>⌕</span>Поиск юзернеймов</button>
<button class="action a2" onclick="go('rate')"><span>✦</span>Оценить</button><button class="action a3" onclick="go('compare')"><span>⇄</span>Сравнить</button>
<button class="action a4" onclick="go('favorites')"><span>♥</span>Избранное</button><button class="action a5" onclick="go('tracker')"><span>◎</span>Трекер</button>
<button class="action a6" onclick="go('profile')"><span>◉</span>Профиль</button><button class="action a7" onclick="go('tariffs')"><span>◇</span>Тарифы</button>
<button class="action a8 wide" onclick="go('help')"><span>?</span>Помощь</button><button class="action a6 wide" onclick="go('admin')"><span>⚙</span>Панель администратора</button>
</div></section><div class="foot">FindTag · Secure Telegram Mini App</div></main><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();}function go(action){if(!tg){alert('Открой Mini App из Telegram.');return;}tg.sendData(JSON.stringify({action}));}
</script></body></html>
